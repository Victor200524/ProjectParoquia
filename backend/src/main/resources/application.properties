spring.application.name=backend
# Senhas e chaves ficam em segredos.properties (fora do Git, ver segredos.properties.exemplo)
spring.config.import=classpath:segredos.properties
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_paroquia
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

api.v1.mercadopago-notification-url=

# Aumenta o limite de cada arquivo para 10 MB
spring.servlet.multipart.max-file-size=10MB
# Aumenta o limite total da requisição
spring.servlet.multipart.max-request-size=10MB
# Nunca devolver o stacktrace do Java no corpo das respostas de erro (o DevTools liga isso em desenvolvimento)
spring.web.error.include-stacktrace=never

# --- E-mail (alertas de pagamento pendente) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=victor.oldonaire@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
